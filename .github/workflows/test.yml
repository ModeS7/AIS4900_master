name: Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'IDUN/**'           # SLURM job scripts
      - '*.md'              # Markdown documentation
      - 'docs/**'           # Documentation folder
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'IDUN/**'
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

# Runs on free GitHub-hosted Ubuntu runners (unlimited minutes on public repos).
# Setup (Python + CPU torch + deps) is shared via .github/actions/setup-medgen.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup-medgen

      - name: Run unit tests
        run: |
          pytest tests/unit -m "not slow" -v --tb=short \
            --cov=src/medgen \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=15

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303  # v5.4.3
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Check syntax with py_compile
        run: find src/medgen -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Lint with ruff
        run: ruff check src/medgen/

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup-medgen

      - name: Run integration tests (CPU only)
        run: |
          pytest tests/integration -m "not slow and not gpu and not baseline" \
            -v --tb=short --timeout=60 \
            --cov=src/medgen \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=0

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303  # v5.4.3
        with:
          files: coverage.xml
          flags: integration
          fail_ci_if_error: false

  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup-medgen

      - name: Run CLI tests (help commands, imports)
        run: |
          pytest tests/e2e/test_cli_complete.py -v --tb=short --timeout=120 \
            --cov=src/medgen \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=0

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303  # v5.4.3
        with:
          files: coverage.xml
          flags: e2e
          fail_ci_if_error: false
