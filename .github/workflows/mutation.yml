name: Mutation Testing

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:  # Allow manual trigger

# Runs on free GitHub-hosted Ubuntu runners (unlimited minutes on public repos).

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: ./.github/actions/setup-medgen

      - name: Install mutmut
        run: pip install mutmut

      - name: Run mutation testing on metrics
        run: |
          mutmut run \
            --paths-to-mutate=src/medgen/metrics/quality.py,src/medgen/metrics/generation.py \
            --tests-dir=tests/unit \
            --runner="pytest tests/unit/test_quality_metrics.py tests/unit/test_generation_metrics.py -x -q"
        continue-on-error: true  # Don't fail the workflow, just report

      - name: Show mutation results
        if: always()
        run: mutmut results
