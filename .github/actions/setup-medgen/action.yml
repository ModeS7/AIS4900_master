name: 'Setup MedGen'
description: 'Set up Python and install MedGen with CPU-only torch + test deps (for free GitHub-hosted runners)'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install CPU torch + package + dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch wheel: avoids the ~2GB CUDA build (no GPU on free runners).
        # Installed first so monai/torchvision see a satisfied torch requirement.
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-timeout ruff
